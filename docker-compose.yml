version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - FAKE_STORE_API_URL=https://fakestoreapi.com
      - EMAIL_PROVIDER=smtp
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=noreply@cataloghub.com
      - NOTIFICATION_EMAIL=admin@cataloghub.com
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    container_name: cataloghub-mailpit
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP Port
